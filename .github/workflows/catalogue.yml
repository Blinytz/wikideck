name: Catalogue vers Supabase Éclats
on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # seulement les scripts (et les données) : pas les milliers d'images
          sparse-checkout: |
            build/serveur
            data
          sparse-checkout-cone-mode: true
      - run: python build/serveur/sync_catalogue.py
        env:
          ECLATS_SUPABASE_URL: https://psutbulpezfdftmaqkoo.supabase.co
          ECLATS_SERVICE_KEY: ${{ secrets.ECLATS_SERVICE_KEY }}
