<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte 3D · essai</title>
<style>
  :root { --fond: #0d0d16; --texte: #ecebf5; --doux: #8f8ca6;
          --commune: #8a93a6; --rare: #4aa8ff; --epique: #b05cff; --mythique: #ff5cd0; --legendaire: #ffd166; --pantheon: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte);
    font: 14px/1.3 system-ui, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, #fff 0%, #fff8 35%, transparent 70%); }
  .barre { position: fixed; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
    flex-wrap: wrap; justify-content: center; padding: 0 12px; width: 100%; max-width: 640px; }
  .haut { top: max(12px, env(safe-area-inset-top)); }
  .bas { bottom: max(16px, env(safe-area-inset-bottom)); }
  button, select { font: inherit; color: var(--texte); background: #1d1d2c; border: 1px solid #ffffff22;
    border-radius: 999px; padding: 9px 15px; cursor: pointer; }
  button.principal { background: linear-gradient(135deg, #7b5cff, #ff5cd0); border: 0; font-weight: 700; padding: 12px 22px; }
  button:disabled { opacity: .45; cursor: default; }
  .rarete { display: flex; gap: 6px; }
  .rarete button { width: 34px; height: 34px; padding: 0; border-width: 2px; }
  .rarete button[data-r="commune"] { border-color: var(--commune); }
  .rarete button[data-r="rare"] { border-color: var(--rare); }
  .rarete button[data-r="epique"] { border-color: var(--epique); }
  .rarete button[data-r="mythique"] { border-color: var(--mythique); }
  .rarete button[data-r="legendaire"] { border-color: var(--legendaire); }
  .rarete button.actif { background: currentColor; }
  .rarete button span { display: block; width: 12px; height: 12px; margin: auto; border-radius: 50%; }
  .rarete button[data-r="commune"] span { background: var(--commune); }
  .rarete button[data-r="rare"] span { background: var(--rare); }
  .rarete button[data-r="epique"] span { background: var(--epique); }
  .rarete button[data-r="mythique"] span { background: var(--mythique); }
  .rarete button[data-r="legendaire"] span { background: var(--legendaire); }
  .rarete button[data-r="pantheon"] { border-color: #fff; }
  .rarete button[data-r="pantheon"] span { background: conic-gradient(#fff, #ff5c8a, #ffd166, #6dff9e, #46c8ff, #b05cff, #fff); }
  .rarete button.actif { outline: 2px solid #fff; outline-offset: 2px; }
  #etat { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--doux); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="flash"></div>
<div id="etat">…</div>
<div class="barre haut">
  <div class="rarete" id="raretes">
    <button data-r="" title="Toutes" class="actif">∗</button>
    <button data-r="commune" title="Commune"><span></span></button>
    <button data-r="rare" title="Rare"><span></span></button>
    <button data-r="epique" title="Épique"><span></span></button>
    <button data-r="mythique" title="Mythique"><span></span></button>
    <button data-r="legendaire" title="Légendaire"><span></span></button>
    <button data-r="pantheon" title="Panthéon"><span></span></button>
  </div>
  <button id="b-gyro" title="Gyroscope">📱</button>
</div>
<div class="barre bas">
  <button id="b-autre">↻</button>
  <button id="b-ouvrir" class="principal">Ouvrir</button>
  <button id="b-tourner">⟲</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- reglages par rarete (a ajuster a l'oeil) ---------- */
const R = {
  commune:    { c: '#8a93a6', foil: 0.0,  suspense: 0.15, secousse: 0,    flash: 0,   part: 0,   rayons: 0,   tours: 0 },
  rare:       { c: '#4aa8ff', foil: 0.15, suspense: 0.45, secousse: 0.01, flash: 0.2, part: 60,  rayons: 0,   tours: 0 },
  epique:     { c: '#b05cff', foil: 0.25, suspense: 0.8,  secousse: 0.03, flash: 0.5, part: 140, rayons: 0.3, tours: 0 },
  mythique:   { c: '#ff5cd0', foil: 0.35, suspense: 1.2,  secousse: 0.04, flash: 0.7, part: 220, rayons: 0.7, tours: 0 },
  legendaire: { c: '#ffd166', foil: 0.45, suspense: 1.7,  secousse: 0.06, flash: 1.0, part: 420, rayons: 1.0, tours: 1 },
  pantheon:   { c: '#ffffff', foil: 0.6,  suspense: 2.4,  secousse: 0.07, flash: 1.0, part: 500, rayons: 1.4, tours: 2 },
};
const NOMS = { commune: 'Commune', rare: 'Rare', epique: 'Épique', mythique: 'Mythique', legendaire: 'Légendaire', pantheon: 'Panthéon' };

/* ---------- scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0d16');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 9);
const lumiere = new THREE.DirectionalLight('#ffffff', 1.1); lumiere.position.set(2, 3, 5); scene.add(lumiere);
scene.add(new THREE.AmbientLight('#ffffff', 0.5));
const halo = new THREE.PointLight('#ffffff', 0, 12); halo.position.set(0, 0, -1.2); scene.add(halo);

function taille() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // la carte (3,52 de haut) tient dans l'ecran, barres comprises
  const vise = Math.max(3.52 / 0.72, 2.52 / 0.86 / camera.aspect);
  camera.position.z = vise / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.updateProjectionMatrix();
}
addEventListener('resize', taille); taille();

/* ---------- textures de la carte, dessinees sur canvas ---------- */
const TW = 1008, TH = 1408;
function arrondi(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function lignes(g, texte, largeur, max) {
  const mots = texte.split(/\s+/), out = []; let l = '';
  for (const m of mots) {
    const t = l ? l + ' ' + m : m;
    if (g.measureText(t).width > largeur && l) { out.push(l); l = m; if (out.length === max) break; } else l = t;
  }
  if (out.length < max && l) out.push(l);
  if (out.length === max && mots.join(' ').length > out.join(' ').length) out[max - 1] = out[max - 1].replace(/\s*\S*$/, ' …');
  return out;
}
async function texRecto(carte, image) {
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d'); const col = R[carte.rarete].c;
  const fond = g.createLinearGradient(0, 0, TW * 0.4, TH); fond.addColorStop(0, '#26263a'); fond.addColorStop(0.7, '#17171f');
  g.fillStyle = fond; g.fillRect(0, 0, TW, TH);
  g.lineWidth = 26; g.strokeStyle = col; arrondi(g, 13, 13, TW - 26, TH - 26, 44); g.stroke();
  g.fillStyle = '#ecebf5'; g.font = '800 58px system-ui, Segoe UI, sans-serif'; g.textBaseline = 'top';
  const nom = lignes(g, carte.nom, TW - 330, 2);
  nom.forEach((l, i) => g.fillText(l, 52, 50 + i * 64));
  g.textAlign = 'right'; g.fillStyle = col; g.font = '800 72px system-ui, sans-serif';
  g.fillText(String(carte.pv ?? ''), TW - 140, 46);
  g.fillStyle = '#ecebf5'; g.font = '600 40px system-ui, sans-serif'; g.fillText('PV', TW - 52, 70);
  g.textAlign = 'left';
  const iy = 50 + nom.length * 64 + 26, iw = TW - 104, ih = iw * 3 / 4;
  g.save(); arrondi(g, 52, iy, iw, ih, 26); g.clip();
  if (image) g.drawImage(image, 52, iy, iw, ih); else { g.fillStyle = '#2a2a40'; g.fillRect(52, iy, iw, ih); }
  g.restore();
  const by = iy + ih + 34;
  g.font = '800 34px system-ui, sans-serif'; const badge = NOMS[carte.rarete].toUpperCase();
  const bw = g.measureText(badge).width + 56;
  g.fillStyle = col; arrondi(g, 52, by, bw, 58, 29); g.fill();
  g.fillStyle = '#101018'; g.fillText(badge, 80, by + 12);
  g.fillStyle = '#9b98b3'; g.font = '500 32px system-ui, sans-serif'; g.textAlign = 'right';
  g.fillText(lignes(g, carte.collection || '', TW - bw - 150, 1)[0] || '', TW - 52, by + 14);
  g.textAlign = 'left'; g.fillStyle = '#cfccdf'; g.font = '400 36px system-ui, sans-serif';
  const desc = lignes(g, carte.description || '', TW - 110, Math.floor((TH - by - 130) / 50));
  desc.forEach((l, i) => g.fillText(l, 52, by + 92 + i * 50));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function texVerso(rarete) {
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d'); const col = R[rarete].c;
  const f = g.createRadialGradient(TW / 2, TH / 2, 40, TW / 2, TH / 2, TH * 0.7);
  f.addColorStop(0, '#2b2b44'); f.addColorStop(1, '#101018'); g.fillStyle = f; g.fillRect(0, 0, TW, TH);
  g.lineWidth = 26; g.strokeStyle = col; arrondi(g, 13, 13, TW - 26, TH - 26, 44); g.stroke();
  g.globalAlpha = 0.55; g.lineWidth = 6; g.beginPath(); g.arc(TW / 2, TH / 2, 300, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(TW / 2, TH / 2, 340, 0, Math.PI * 2); g.lineWidth = 2; g.stroke(); g.globalAlpha = 1;
  g.fillStyle = '#ecebf5'; g.font = '700 300px Georgia, Times New Roman, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('W', TW / 2, TH / 2 + 10);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* ---------- la carte : un vrai volume, avec tranche ---------- */
const W = 2.52, H = 3.52, E = 0.04;
const geo = new RoundedBoxGeometry(W, H, E, 6, 0.13);
const matTranche = new THREE.MeshStandardMaterial({ color: '#8a93a6', metalness: 0.85, roughness: 0.28 });
const matRecto = new THREE.MeshPhysicalMaterial({ roughness: 0.55, clearcoat: 0.6, clearcoatRoughness: 0.15, envMapIntensity: 0.3 });
const matVerso = new THREE.MeshPhysicalMaterial({ roughness: 0.55, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: 0.3 });
// groupes de la boite : +x, -x, +y, -y, +z (recto), -z (verso)
const carte3d = new THREE.Mesh(geo, [matTranche, matTranche, matTranche, matTranche, matRecto, matVerso]);
const pivot = new THREE.Group(); pivot.add(carte3d); scene.add(pivot);

// reflet holographique, superpose au recto ; il bouge avec l'inclinaison
const foil = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.04, H - 0.04), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uForce: { value: 0 }, uTilt: { value: new THREE.Vector2() }, uTemps: { value: 0 },
              uOr: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uForce; uniform vec2 uTilt; uniform float uTemps; uniform float uOr;
    vec3 arc(float t){ return .5 + .5*cos(6.2831*(t + vec3(0.,.33,.67))); }
    void main(){
      float d = dot(vUv - .5, vec2(.7,.7)) + uTilt.x*.9 - uTilt.y*.6;
      float bande = smoothstep(.0,.35, .35 - abs(fract(d*1.4 + uTemps*.03) - .5));
      vec3 c = mix(arc(d*1.6 + uTilt.y), vec3(1.,.82,.38), uOr);
      float grain = fract(sin(dot(floor(vUv*180.), vec2(12.9898,78.233)))*43758.5453);
      float scint = step(.985, grain) * (.6 + .4*sin(uTemps*6. + grain*40.));
      // l'illustration reste lisible : reflet attenue sur elle
      float img = step(.40, vUv.y) * step(vUv.y, .91) * step(.05, vUv.x) * step(vUv.x, .95);
      gl_FragColor = vec4(c * (bande*.55*(1. - .7*img) + scint*.8) * uForce, 1.);
    }`,
}));
foil.position.z = E / 2 + 0.002; carte3d.add(foil);

/* ---------- rayons et particules de la revelation ---------- */
const rayons = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uForce: { value: 0 }, uTemps: { value: 0 }, uCouleur: { value: new THREE.Color('#ffd166') } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uForce; uniform float uTemps; uniform vec3 uCouleur;
    void main(){
      vec2 p = vUv - .5; float a = atan(p.y, p.x); float r = length(p);
      float s = pow(.5 + .5*sin(a*14. + uTemps*.8), 6.) + .5*pow(.5 + .5*sin(a*7. - uTemps*.5), 8.);
      float f = s * smoothstep(.5, .05, r) * smoothstep(0., .06, r);
      gl_FragColor = vec4(uCouleur * f * uForce, 1.);
    }`,
}));
rayons.position.z = -1.4; scene.add(rayons);

function textureEtincelle() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, '#fff'); r.addColorStop(0.25, '#fffa'); r.addColorStop(1, '#fff0');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const NP = 500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(NP * 3), pVit = new Float32Array(NP * 3), pVie = new Float32Array(NP);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ size: 0.11, map: textureEtincelle(), transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, color: '#ffd166' });
const particules = new THREE.Points(pGeo, pMat); scene.add(particules);
let nbActives = 0;
function eclater(n, couleur) {
  pMat.color.set(couleur); nbActives = n;
  for (let i = 0; i < NP; i++) {
    const vivant = i < n, a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4.5;
    pPos.set(vivant ? [(Math.random() - .5) * W, (Math.random() - .5) * H, 0.2] : [0, 0, -50], i * 3);
    pVit.set([Math.cos(a) * v, Math.sin(a) * v + 1.5, (Math.random() - .3) * 2], i * 3);
    pVie[i] = vivant ? 1.4 + Math.random() * 1.2 : 0;
  }
  pGeo.attributes.position.needsUpdate = true;
}
function animerParticules(dt) {
  if (!nbActives) return;
  let vivantes = 0;
  for (let i = 0; i < nbActives; i++) {
    if (pVie[i] <= 0) continue;
    pVie[i] -= dt; vivantes++;
    pVit[i * 3 + 1] -= 3.2 * dt;                         // gravite
    for (let k = 0; k < 3; k++) { pVit[i * 3 + k] *= (1 - 0.9 * dt); pPos[i * 3 + k] += pVit[i * 3 + k] * dt; }
    if (pVie[i] <= 0) pPos[i * 3 + 2] = -50;
  }
  pMat.opacity = 1;
  pGeo.attributes.position.needsUpdate = true;
  if (!vivantes) nbActives = 0;
}

/* ---------- donnees : une vraie carte du jeu ---------- */
const etat = document.getElementById('etat');
let index = null, carteCourante = null, filtre = '';
async function chargerIndex() {
  index = await (await fetch('../data/collections.json')).json();
}
async function tirerCarte() {
  for (let essai = 0; essai < 12; essai++) {
    const col = index.collections[Math.floor(Math.random() * index.collections.length)];
    const d = await (await fetch('../' + col.fichier)).json();
    const cartes = d.cartes.filter(c => !filtre || c.rarete === filtre);
    if (cartes.length) return cartes[Math.floor(Math.random() * cartes.length)];
  }
}
function chargerImage(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
async function poserCarte(carte) {
  carteCourante = carte;
  const image = await chargerImage('../' + carte.imageUrl + (carte.imgV ? '?v=' + carte.imgV : ''));
  matRecto.map?.dispose(); matVerso.map?.dispose();
  matRecto.map = await texRecto(carte, image); matVerso.map = texVerso(carte.rarete);
  matRecto.needsUpdate = matVerso.needsUpdate = true;
  const r = R[carte.rarete];
  matTranche.color.set(r.c);
  // irisation du vernis : nulle sur une commune, forte sur une legendaire
  matRecto.iridescence = r.foil; matRecto.iridescenceIOR = 1.35;
  foil.material.uniforms.uForce.value = r.foil;
  foil.material.uniforms.uOr.value = carte.rarete === 'legendaire' ? 0.55 : 0;
  rayons.material.uniforms.uCouleur.value.set(r.c);
  halo.color.set(r.c);
  etat.textContent = '';
}

/* ---------- inclinaison : doigt, souris ou gyroscope ---------- */
const vise = { x: 0, y: 0 }, inc = { x: 0, y: 0 };
let gyro = false, retournee = false;
addEventListener('pointermove', e => {
  if (gyro) return;
  vise.y = (e.clientX / innerWidth - .5) * 0.7;
  vise.x = (e.clientY / innerHeight - .5) * 0.55;
});
addEventListener('pointerleave', () => { vise.x = vise.y = 0; });
document.getElementById('b-gyro').addEventListener('click', async () => {
  try {
    if (DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission();
    gyro = !gyro;
    document.getElementById('b-gyro').classList.toggle('actif', gyro);
  } catch {}
});
addEventListener('deviceorientation', e => {
  if (!gyro || e.beta == null) return;
  vise.x = THREE.MathUtils.clamp((e.beta - 40) / 60, -.5, .5);
  vise.y = THREE.MathUtils.clamp(e.gamma / 50, -.6, .6);
});

/* ---------- la revelation : une petite ligne de temps ---------- */
let anim = null;                    // { t0, r, phases... }
const lisse = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const sortie = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const flash = document.getElementById('flash');
function eclair(force) {
  if (!force) return;
  flash.style.transition = 'none'; flash.style.opacity = force;
  requestAnimationFrame(() => { flash.style.transition = 'opacity .7s ease-out'; flash.style.opacity = 0; });
}
async function ouvrir() {
  const b = document.getElementById('b-ouvrir'); b.disabled = true;
  etat.textContent = '…';
  await poserCarte(await tirerCarte());
  const r = R[carteCourante.rarete];
  anim = { t0: performance.now() / 1000, r, arrivee: 0.7, suspense: r.suspense, retour: r.tours ? 1.3 : 0.55,
           flipFait: false, fini: false };
  retournee = false;
  b.disabled = false;
}
function animerRevelation(t) {
  const a = anim, r = a.r, dt = t - a.t0;
  const t1 = a.arrivee, t2 = t1 + a.suspense, t3 = t2 + a.retour;
  let y = 0, z = 0, rotY = Math.PI, rotZ = 0, sx = 0, sy = 0, s = 1;
  if (dt < t1) {                                         // arrivee, face cachee
    const k = sortie(dt / t1);
    y = -6 * (1 - k); z = -3 * (1 - k); rotZ = (1 - k) * 0.6; s = 0.7 + 0.3 * k;
  } else if (dt < t2) {                                  // suspense : la carte vibre de plus en plus
    const k = (dt - t1) / Math.max(a.suspense, 0.01);
    sx = (Math.random() - .5) * r.secousse * k * 2; sy = (Math.random() - .5) * r.secousse * k * 2;
    halo.intensity = 30 * r.flash * k;
    rayons.material.uniforms.uForce.value = r.rayons * k * 0.5;
    z = 0.25 * k * (r.secousse > 0 ? 1 : 0);
  } else if (dt < t3) {                                  // retournement
    const k = lisse((dt - t2) / a.retour);
    rotY = Math.PI + k * (Math.PI + r.tours * Math.PI * 2);
    z = Math.sin(k * Math.PI) * (0.8 + r.tours * 0.6);
    if (!a.flipFait && k > 0.5) {
      a.flipFait = true; eclair(r.flash); retournee = true;
      if (r.part) eclater(r.part, r.c);
    }
    rayons.material.uniforms.uForce.value = r.rayons * (0.5 + 0.5 * k);
    halo.intensity = 30 * r.flash;
  } else {                                               // la carte se pose, les rayons s'eteignent doucement
    const k = Math.min(1, (dt - t3) / 2.5);
    rotY = 0; rayons.material.uniforms.uForce.value = r.rayons * (1 - k) * 0.9 + r.rayons * 0.1;
    halo.intensity = 30 * r.flash * (1 - k) + 4 * r.flash;
    if (k >= 1) a.fini = true;
  }
  pivot.position.set(sx, y + sy, z); pivot.scale.setScalar(s);
  carte3d.rotation.set(0, rotY, rotZ);
}

/* ---------- boucle ---------- */
let precedent = performance.now() / 1000;
function boucle() {
  const t = performance.now() / 1000, dt = Math.min(0.05, t - precedent); precedent = t;
  inc.x += (vise.x - inc.x) * Math.min(1, dt * 7); inc.y += (vise.y - inc.y) * Math.min(1, dt * 7);
  pivot.rotation.set(inc.x, inc.y, 0);
  if (anim && !anim.fini) animerRevelation(t);
  else if (!anim) carte3d.rotation.y += ((retournee ? Math.PI : 0) - carte3d.rotation.y) * Math.min(1, dt * 8);
  foil.material.uniforms.uTilt.value.set(inc.y, inc.x);
  foil.material.uniforms.uTemps.value = t;
  rayons.material.uniforms.uTemps.value = t;
  rayons.rotation.z = t * 0.05;
  animerParticules(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
}

/* ---------- commandes ---------- */
document.getElementById('raretes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filtre = b.dataset.r;
  for (const x of document.querySelectorAll('#raretes button')) x.classList.toggle('actif', x === b);
  autre();
});
async function autre() {
  anim = null; retournee = false; rayons.material.uniforms.uForce.value = 0; halo.intensity = 0;
  pivot.position.set(0, 0, 0); pivot.scale.setScalar(1); carte3d.rotation.set(0, 0, 0);
  etat.textContent = '…'; await poserCarte(await tirerCarte());
}
document.getElementById('b-autre').addEventListener('click', autre);
document.getElementById('b-ouvrir').addEventListener('click', ouvrir);
document.getElementById('b-tourner').addEventListener('click', () => {
  if (anim && !anim.fini) return;
  anim = null; retournee = !retournee;
});
canvas.addEventListener('click', () => { if (!anim || anim.fini) { anim = null; retournee = !retournee; } });

await chargerIndex();
await autre();
boucle();
</script>
