<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>WikiDeck · essai de design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap">

<body class="v2" data-ecran="accueil">
<div id="attente">
  <div class="sceau"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="54"/></svg><span class="w">W</span></div>
  <div class="nom">Wiki<em>Deck</em></div>
</div>
<div id="ambiance"></div>

<div class="page">
  <section class="ecran actif" id="accueil"></section>
  <section class="ecran" id="questions"></section>
  <section class="ecran" id="collection"></section>
  <section class="ecran" id="boutique"></section>
  <section class="ecran" id="plus"></section>
</div>

<nav class="onglets2" id="onglets">
  <button data-aller="accueil" class="actif"><i class="ph-fill ph-house"></i><span>Accueil</span></button>
  <button data-aller="questions"><i class="ph ph-lightbulb"></i><span>Questions</span><b class="pastille"></b></button>
  <button data-aller="collection"><i class="ph ph-cards-three"></i><span>Collection</span></button>
  <button data-aller="boutique"><i class="ph ph-storefront"></i><span>Boutique</span></button>
  <button data-aller="plus"><i class="ph ph-dots-three-circle"></i><span>Plus</span></button>
</nav>

<script type="module">
import { htmlCarte, brancherInclinaison, RARETES, NOMS, ICONES, esc } from '../js/v2/carte.js';
import { ouvrirPaquet } from '../js/v2/ouverture.js';
import { son, sonActif, activerSon } from '../js/v2/son.js';

const BASE = '../';
const $ = (s, r = document) => r.querySelector(s);
const vibrer = (ms = 8) => { try { if (navigator.userActivation?.hasBeenActive !== false) navigator.vibrate?.(ms); } catch {} };
const fr = (n) => Math.round(n).toLocaleString('fr-FR');
const transition = (fn) => (document.startViewTransition ? document.startViewTransition(fn) : (fn(), { finished: Promise.resolve() }));
const REVENTE = { commune: 150, rare: 300, epique: 750, mythique: 1500, legendaire: 4500, pantheon: 15000 };
const RANG = (r) => RARETES.indexOf(r);

// ---------- une teinte par thème : collections comme questions ----------
const TEINTES = [
  [/gastro|cuisine|aliment|boisson/i, '#f0876a', 'ph-fork-knife'],
  [/relig|mytho|croyance/i, '#b79cff', 'ph-flower-lotus'],
  [/hist|politi|guerre/i, '#e5766a', 'ph-crown-simple'],
  [/scien|tech|math|physi|chimi|m[ée]dec|astro|invent/i, '#6ea8ff', 'ph-atom'],
  [/nature|anima|botan|zoo|oiseau/i, '#66d19e', 'ph-leaf'],
  [/g[ée]o|pays|ville|capital/i, '#4cc9c0', 'ph-globe-hemisphere-west'],
  [/[ée]cran|jeu|cin[ée]|t[ée]l[ée]|film|s[ée]rie|bande/i, '#ff7fc3', 'ph-film-slate'],
  [/art|peint|archi|musi|sculpt|op[ée]ra/i, '#f0b25a', 'ph-paint-brush-broad'],
  [/sport/i, '#ff9b52', 'ph-soccer-ball'],
  [/lettre|litt[ée]r|pens[ée]e|philo|langu/i, '#d8c49a', 'ph-feather'],
];
const teinte = (t = '') => { const m = TEINTES.find(([r]) => r.test(t)); return m ? { c: m[1], ic: m[2] } : { c: '#a7a4ae', ic: 'ph-circles-four' }; };

// ---------- mouvement : cascade, compteurs ----------
function cascade(z) { [...z.children].forEach((el, i) => { el.classList.add('entre'); el.style.setProperty('--i', i); }); }
const derniers = new Map();
function compter(el, cle, vers, dur = 900) {
  if (!el) return;
  const de = derniers.get(cle) ?? 0; derniers.set(cle, vers);
  const t0 = performance.now(), suffixe = el.dataset.suffixe || '';
  const pas = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - (1 - p) ** 3; el.innerHTML = fr(de + (vers - de) * e) + suffixe; if (p < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}
function toast(ic, txt) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<i class="ph-fill ${ic}"></i>${txt}`; document.body.append(t); setTimeout(() => t.remove(), 2500); }

// ---------- données réelles, possession simulée mais stable ----------
const hash = (s) => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };
const TAUX = { commune: .55, rare: .4, epique: .25, mythique: .12, legendaire: .06, pantheon: .03 };
const possede = new Map();
let indexNoms = null;
const progresAttente = (p) => $('#attente svg')?.style.setProperty('--p', p);
const debutAttente = performance.now();
const idx = await (await fetch(BASE + 'data/collections.json')).json();
const cols = idx.collections.map((e) => ({ ...e, cartes: null, t: teinte(e.theme) }));
async function charger(col) {
  if (col.cartes) return col;
  col.cartes = (await (await fetch(BASE + col.fichier)).json()).cartes.map((c) => ({ ...c, thumbUrl: BASE + c.thumbUrl, imageUrl: BASE + c.imageUrl, total: col.nbCartes }));
  col.parId = new Map(col.cartes.map((c) => [c.id, c]));
  for (const c of col.cartes) { const h = hash(c.id); if (h < TAUX[c.rarete]) possede.set(c.id, 1 + (hash(c.id + 'x') < .25 ? 1 + Math.floor(hash(c.id + 'y') * 3) : 0)); }
  indexNoms = null;
  return col;
}
const melange = [...cols].sort((a, b) => hash(a.slug) - hash(b.slug));
let n0 = 0;
await Promise.all(melange.slice(0, 20).map((c) => charger(c).then(() => progresAttente(++n0 / 20))));
(async () => { for (let i = 20; i < melange.length; i += 8) await Promise.all(melange.slice(i, i + 8).map(charger)); if (ecran === 'collection' && !vueCol) rendreCollection(); })();
const chargees = () => cols.filter((c) => c.cartes);
const toutes = () => chargees().flatMap((c) => c.cartes);
const colDe = (carte) => cols.find((c) => c.parId?.has(carte.id));
const hasard = (t) => t[Math.floor(Math.random() * t.length)];
const ARTICLES = /^(le|la|les|l|un|une|des|du|de|d|au|aux|the|a|an)\s+/;
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’'`]/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(ARTICLES, '').replace(ARTICLES, '');
function carteLiee(reponse) {
  if (!indexNoms) { indexNoms = new Map(); for (const c of toutes()) for (const n of [c.nom, c.titrePage, (c.titrePage || '').replace(/\s*\([^)]*\)/g, '')]) if (n) indexNoms.set(norm(n), c); }
  for (const r of [reponse, reponse.replace(/\s*\([^)]*\)/g, '')]) { const c = indexNoms.get(norm(r)); if (c) return c; }
  return null;
}

// ---------- navigation ----------
let ecran = 'accueil';
const RENDUS = { accueil: rendreAccueil, questions: rendreQuestions, collection: rendreCollection, boutique: rendreBoutique, plus: rendrePlus };
function aller(nom) {
  if (nom === ecran && nom !== 'collection') return;
  vibrer(); son('onglet');
  transition(() => {
    ecran = nom; document.body.dataset.ecran = nom;
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === nom));
    document.querySelectorAll('#onglets button').forEach((b) => {
      const a = b.dataset.aller === nom, i = b.querySelector('i');
      b.classList.toggle('actif', a);
      i.className = `${a ? 'ph-fill' : 'ph'} ${i.className.split(' ').find((x) => x.startsWith('ph-') && x !== 'ph-fill')}`;
    });
    if (nom === 'collection') vueCol = null;
    RENDUS[nom]();
    scrollTo(0, 0);
  });
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-aller]'); if (b) aller(b.dataset.aller); });
let solde = 12480;
const htmlSolde = () => `<button class="solde pressable" data-aller="boutique"><i class="ph-fill ph-diamond"></i><span class="chiffre solde-v">${fr(solde)}</span></button>`;
function majSolde(delta) { const avant = solde; solde += delta; document.querySelectorAll('.solde-v').forEach((s) => { derniers.set('solde', avant); compter(s, 'solde', solde, 700); }); }
const fmtTemps = (s) => `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

// ---------- accueil ----------
const DUREE = 12 * 3600e3;
let paquets = 3, tete = 'auto';
let fin = Date.now() + 4 * 3600e3 + 12 * 60e3;
const historique = [];
let vitrine = null;
const RAYON = 134, CIRC = 2 * Math.PI * RAYON;
function vedetteAmbiance() {
  const c = [...historique].sort((a, b) => RANG(b.rarete) - RANG(a.rarete))[0];
  if (c) $('#ambiance').style.setProperty('--img', `url('${c.imageUrl}')`);
}
function carteDuJour() {
  const pool = toutes().filter((c) => RANG(c.rarete) >= 2 && (c.description || '').length > 120);
  return pool[Math.floor(hash(new Date().toDateString() + 'cdj') * pool.length)];
}
const phrase = (d) => { const s = (d || '').replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(); const m = s.match(/^.{60,260}?[.!?](\s|$)/); return m ? m[0].trim() : s.slice(0, 220) + '…'; };
function rendreAccueil() {
  const z = $('#accueil');
  const tous = toutes(), n = tous.filter((c) => possede.has(c.id)).length, pct = n / Math.max(1, tous.length);
  if (!historique.length) historique.push(...tous.filter((c) => possede.has(c.id)).sort((a, b) => hash(a.id + 'h') - hash(b.id + 'h')).slice(0, 10));
  vitrine ??= tous.filter((c) => possede.has(c.id)).sort((a, b) => RANG(b.rarete) - RANG(a.rarete) || b.pv - a.pv).slice(0, 2).map((c) => c.id);
  const cdj = carteDuJour(), tc = teinte(colDe(cdj)?.theme), tq = teinte(QDJ.theme);
  const vit = vitrine.map((id) => toutes().find((c) => c.id === id)).filter(Boolean);
  vedetteAmbiance();
  z.innerHTML = `<div class="barre"><div class="marque">Wiki<em>Deck</em></div>${htmlSolde()}</div>
    <div class="hero" id="hero">
      <div class="orbite">
        <svg viewBox="0 0 280 280"><defs><linearGradient id="degrade-or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#e2b35a"/></linearGradient></defs>
          <circle class="fond-anneau" cx="140" cy="140" r="${RAYON}"/><circle class="arc" id="arc" cx="140" cy="140" r="${RAYON}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/><circle class="tete" id="tete-arc" r="4.5" cx="${140 + RAYON}" cy="140"/></svg>
        <div class="paquets${paquets ? '' : ' aucun'}" id="paquets">
          ${paquets > 2 ? '<div class="mini-pk derriere2"></div>' : ''}${paquets > 1 ? '<div class="mini-pk derriere"></div>' : ''}
          <div class="mini-pk devant"><div class="k-mono">W</div></div>
          ${paquets > 1 ? `<span class="nb-paquets">${paquets}</span>` : ''}
        </div>
      </div>
      ${paquets ? `<button class="btn2 or" id="ouvrir"><i class="ph-bold ph-cards"></i>Ouvrir</button>` : ''}
      <div class="prochain"><i class="ph-fill ph-timer"></i><span id="minuteur"></span></div>
    </div>
    <div class="essai" id="essai">${['auto', ...RARETES].map((r) => `<button data-r="${r}" class="${r === tete ? 'actif' : ''}"><i class="ph${r === 'auto' ? ' ph-shuffle' : '-fill ' + ICONES[r]}"></i></button>`).join('')}</div>

    <button class="bloc qdj pressable" data-aller="questions" style="--t:${tq.c}">
      <div class="ligne1"><span class="tag or"><i class="ph-fill ph-star"></i>Question du jour</span><span class="tag"><i class="ph-bold ph-timer"></i>−3 h</span></div>
      <div class="q">${esc(QDJ.question)}</div>
      <div class="aller"><span class="tag teinte"><i class="ph-fill ${tq.ic}"></i>${esc(QDJ.theme)}</span><i class="ph-bold ph-arrow-right"></i></div>
    </button>
    <button class="bloc carte-jour pressable" id="cdj" style="--t:${tc.c}">
      ${htmlCarte(cdj)}
      <div class="droite"><span class="surtitre">Carte du jour</span><h3>${esc(cdj.nom)}</h3><p>${esc(phrase(cdj.description))}</p></div>
    </button>
    <div class="duo">
      <button class="bloc pressable">
        <div class="haut"><span class="surtitre">Série</span><i class="ph-fill ph-fire" style="color:#ff9f5a;font-size:20px"></i></div>
        <div class="grand"><span id="v-serie">12</span><small>jours</small></div>
        <div class="semaine">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((j, i) => `<i class="${i < 2 ? 'fait' : i === 2 ? 'auj' : ''}">${j}</i>`).join('')}</div>
      </button>
      <button class="bloc pressable" data-aller="collection">
        <div class="haut"><span class="surtitre">Collection</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="grand"><span id="v-pct">0</span><small>%</small></div>
          <div class="anneau"><svg width="52" height="52"><circle cx="26" cy="26" r="22" fill="none" stroke="#ffffff14" stroke-width="5"/><circle class="v" id="anneau-col" cx="26" cy="26" r="22" fill="none" stroke="#f3f1ec" stroke-width="5" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 22}" stroke-dashoffset="${2 * Math.PI * 22}"/></svg></div>
        </div>
        <span class="chiffre" style="font-size:12px;color:var(--texte-3)"><span id="v-n">0</span> cartes</span>
      </button>
    </div>
    <div class="section-titre"><h2>Vitrine</h2><span class="surtitre">${vit.length}/3</span></div>
    <div class="vitrine" id="vitrine">${[0, 1, 2].map((i) => (vit[i] ? htmlCarte(vit[i]) : `<button class="case-vide" data-aller="collection"><i class="ph ph-push-pin"></i></button>`)).join('')}</div>
    ${historique.length ? `<div class="section-titre"><h2>Dernières cartes</h2><button class="lien">Historique</button></div>
    <div class="defile" id="dernieres">${historique.map((c) => htmlCarte(c)).join('')}</div>` : ''}`;
  cascade(z);
  requestAnimationFrame(() => {
    compter($('#v-pct'), 'pct', Math.round(pct * 100)); compter($('#v-n'), 'n', n);
    $('#anneau-col').style.strokeDashoffset = 2 * Math.PI * 22 * (1 - pct);
  });
  majMinuteur(); clearInterval(window.__min); window.__min = setInterval(majMinuteur, 1000);
  $('#essai').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; tete = b.dataset.r; z.querySelectorAll('#essai button').forEach((x) => x.classList.toggle('actif', x === b)); });
  $('#ouvrir')?.addEventListener('click', lancer);
  const pk = $('#paquets'), hero = $('.orbite');
  pk.addEventListener('click', lancer);
  hero.addEventListener('pointermove', (e) => { const r = pk.getBoundingClientRect(); pk.classList.add('tilt'); pk.style.setProperty('--ry', `${((e.clientX - r.left) / r.width - .5) * 26}deg`); pk.style.setProperty('--rx', `${(.5 - (e.clientY - r.top) / r.height) * 26}deg`); });
  hero.addEventListener('pointerleave', () => { pk.classList.remove('tilt'); pk.style.setProperty('--rx', '0deg'); pk.style.setProperty('--ry', '0deg'); });
  const lier = (sel, liste) => z.querySelectorAll(sel).forEach((el) => { el.classList.add('pressable'); el.addEventListener('click', (e) => { e.stopPropagation(); fiche(liste, liste.findIndex((c) => c.id === el.dataset.id), el); }); });
  lier('#dernieres .k', historique); lier('#vitrine .k', vit);
  $('#cdj').addEventListener('click', () => fiche([cdj], 0, $('#cdj .k')));
}
function majMinuteur() {
  if (fin <= Date.now()) { while (fin <= Date.now()) { paquets++; fin += DUREE; } toast('ph-cards', 'Nouveau paquet'); son('palier'); if (ecran === 'accueil') rendreAccueil(); return; }
  const reste = fin - Date.now(), m = $('#minuteur'); if (!m) return;
  m.textContent = fmtTemps(Math.round(reste / 1000));
  const p = 1 - reste / DUREE, a = $('#arc'), t = $('#tete-arc');
  if (a) a.style.strokeDashoffset = CIRC * (1 - p);
  if (t) { const ang = p * 2 * Math.PI; t.setAttribute('cx', 140 + RAYON * Math.cos(ang)); t.setAttribute('cy', 140 + RAYON * Math.sin(ang)); }
}
function tirer() {
  const par = Object.groupBy(toutes(), (c) => c.rarete);
  const t = ['commune', 'commune', 'commune', 'commune', Math.random() < .5 ? 'commune' : 'rare', 'rare'];
  let haut = tete;
  if (haut === 'auto') { const x = Math.random(); haut = x < .005 ? 'pantheon' : x < .03 ? 'legendaire' : x < .1 ? 'mythique' : x < .3 ? 'epique' : 'rare'; }
  t.push(haut);
  return t.map((r) => { const c = hasard(par[r] || par.commune); return { carte: c, neuve: !possede.has(c.id) }; });
}
async function lancer() {
  if (!paquets) return;
  vibrer(12);
  const t = tirer();
  await ouvrirPaquet(t);
  paquets--;
  t.forEach(({ carte }) => { possede.set(carte.id, (possede.get(carte.id) || 0) + 1); historique.unshift(carte); });
  historique.length = Math.min(historique.length, 14);
  rendreAccueil();
}

// ---------- questions : règles du vrai jeu (sans fin, 3 propositions, suite) ----------
const ECHANTILLON = [
  ['Quel souverain fit bâtir la galerie des Glaces ?', 'Louis XIV', 'Histoire', 2],
  ['Quel élément chimique a pour symbole W ?', 'Tungstène', 'Sciences', 3],
  ['Dans quel pays se trouve le château de Neuschwanstein ?', 'Allemagne', 'Géographie', 1],
  ['Qui a peint La Jeune Fille à la perle ?', 'Johannes Vermeer', 'Arts', 2],
  ['Quel oiseau est l’emblème de la Nouvelle-Zélande ?', 'Kiwi', 'Nature', 1],
  ['Sur quelle planète se trouve Olympus Mons ?', 'Mars', 'Sciences', 2],
  ['Quelle est la capitale de l’Australie ?', 'Canberra', 'Géographie', 2],
  ['Qui a écrit Les Misérables ?', 'Victor Hugo', 'Littérature', 1],
  ['Quel compositeur a écrit La Flûte enchantée ?', 'Wolfgang Amadeus Mozart', 'Musique', 2],
  ['En quelle année est tombé le mur de Berlin ?', '1989', 'Histoire', 2],
  ['Quel est le plus long fleuve de France ?', 'Loire', 'Géographie', 1],
  ['Qui a formulé la théorie de la relativité générale ?', 'Albert Einstein', 'Sciences', 1],
  ['Quel peintre s’est coupé une partie de l’oreille ?', 'Vincent van Gogh', 'Arts', 1],
  ['Quelle reine d’Égypte s’allia à Marc Antoine ?', 'Cléopâtre VII', 'Histoire', 1],
  ['Quel gaz les plantes absorbent-elles pour la photosynthèse ?', 'Dioxyde de carbone', 'Sciences', 2],
  ['Quel architecte a conçu la Sagrada Família ?', 'Antoni Gaudí', 'Arts', 2],
  ['Quel est le plus haut sommet d’Afrique ?', 'Kilimandjaro', 'Géographie', 2],
  ['Qui a réalisé le film Les Temps modernes ?', 'Charlie Chaplin', 'Cinéma', 2],
  ['Quel philosophe a écrit Ainsi parlait Zarathoustra ?', 'Friedrich Nietzsche', 'Philosophie', 3],
  ['Quelle mer borde la ville d’Odessa ?', 'Mer Noire', 'Géographie', 2],
  ['Quel empereur romain fit construire un mur dans le nord de la Bretagne romaine ?', 'Hadrien', 'Histoire', 3],
  ['Dans quel opéra de Bizet chante-t-on la Habanera ?', 'Carmen', 'Musique', 2],
  ['Quel navigateur portugais a atteint l’Inde par la mer en 1498 ?', 'Vasco de Gama', 'Histoire', 3],
  ['Quelle particule porte une charge électrique négative dans l’atome ?', 'Électron', 'Sciences', 1],
  ['Quel poète a écrit Les Fleurs du mal ?', 'Charles Baudelaire', 'Littérature', 1],
  ['Quel pays a pour capitale Oulan-Bator ?', 'Mongolie', 'Géographie', 2],
  ['Qui a peint le plafond de la chapelle Sixtine ?', 'Michel-Ange', 'Arts', 1],
  ['Quel savant a découvert la pénicilline ?', 'Alexander Fleming', 'Sciences', 2],
  ['Quelle bataille de 1815 marqua la chute de Napoléon ?', 'Bataille de Waterloo', 'Histoire', 1],
  ['Quel est l’os le plus long du corps humain ?', 'Fémur', 'Sciences', 2],
  ['Quel écrivain russe a écrit Crime et Châtiment ?', 'Fiodor Dostoïevski', 'Littérature', 3],
  ['Quel dieu grec porte un trident ?', 'Poséidon', 'Mythologie', 1],
  ['Quel détroit sépare l’Europe de l’Afrique ?', 'Détroit de Gibraltar', 'Géographie', 1],
  ['Quel physicien a énoncé le principe d’incertitude ?', 'Werner Heisenberg', 'Sciences', 4],
  ['Quelle dynastie régnait en Chine quand fut bâtie la Cité interdite ?', 'Dynastie Ming', 'Histoire', 4],
  ['Quel mathématicien grec a donné son nom au théorème sur le triangle rectangle ?', 'Pythagore', 'Sciences', 1],
].map(([q, r, th, d], i) => ({ id: 'e' + i, question: q, reponse: r, variantes: [], theme: th, difficulte: d }));
// sur l'appareil où le vrai jeu est connecté, on reprend sa copie des vraies questions
let BANQUE = ECHANTILLON;
try { const c = JSON.parse(localStorage.getItem('wikideck-questions-cache') || '[]'); if (c.length > 50) BANQUE = c; } catch {}
const NIVEAUX = ['', 'Débutant', 'Confirmé', 'Expert', 'Nobel', 'Omniscient'];
const GAINS = [0, 6, 12, 24, 45, 90];
const PALIERS = [[3, 1.5], [5, 2], [10, 3], [20, 4]];
const FLAMMES = { 1: ['#6b6873', 0], 1.5: ['#ff9f5a', 6], 2: ['#ff7a3d', 10], 3: ['#f2c66d', 14], 4: ['#9fd8ff', 20] };
const multiplicateur = (s) => [...PALIERS].reverse().find(([n]) => s >= n)?.[1] ?? 1;
const lev = (a, b) => { let p = Array.from({ length: b.length + 1 }, (_, j) => j); for (let i = 1; i <= a.length; i++) { const c = [i]; for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[b.length]; };
function correcte(qu, saisie) {
  const s = norm(saisie); if (!s) return false;
  const brut = [qu.reponse, ...(qu.variantes || [])];
  brut.slice().forEach((r) => { const x = r.replace(/\s*\([^)]*\)\s*/g, ' ').trim(); if (x !== r) brut.push(x); });
  const ok = brut.map(norm).filter(Boolean);
  ok.slice().forEach((r) => { const m = r.split(' '); if (m.length >= 2 && m.length <= 3 && m.at(-1).length >= 4) ok.push(m.at(-1)); });
  return ok.some((r) => lev(s, r) <= Math.floor(r.length * .2));
}
const fmtMin = (m) => (m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}` : `${m} min`);
const fmtX = (x) => '×' + String(x).replace('.', ',');
const QDJ = BANQUE[Math.floor(hash(new Date().toDateString()) * BANQUE.length)];
const qs = { suite: 0, qdjFaite: false, props: null, enCours: null, vues: new Set([QDJ.id]) };
function tirerPropositions() {
  const pool = BANQUE.filter((x) => !qs.vues.has(x.id)); const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  if (out.length < 3) { qs.vues = new Set([QDJ.id]); return tirerPropositions(); }
  return out;
}
const htmlMulti = (classe = '') => { const m = multiplicateur(qs.suite); return `<span class="multi${m > 1 ? ' chaud' : ''}${classe}"><i class="ph-fill ph-lightning"></i>${fmtX(m)}</span>`; };
function htmlSuite() {
  const m = multiplicateur(qs.suite), [fc, glow] = FLAMMES[m];
  const base = [...PALIERS].reverse().find(([n]) => qs.suite >= n)?.[0] ?? 0, pp = PALIERS.find(([n]) => n > qs.suite);
  return `<div class="suite" style="--fc:${fc};--glow:${glow}px">
    <div class="flamme${qs.suite ? '' : ' eteinte'}"><i class="ph-fill ph-fire" style="--h:${Math.min(40, 22 + qs.suite * 1.2)}px"></i></div>
    <div class="suite-l"><b>${qs.suite}</b></div>
    <div class="suite-barre">${pp ? `<div class="barre2"><i style="width:${(qs.suite - base) / (pp[0] - base) * 100}%"></i></div><span>${fmtX(pp[1])} à ${pp[0]}</span>` : '<span>Maximum</span>'}</div></div>`;
}
const enteteQuestions = () => `<div class="grand-titre"><div><h1>Questions</h1></div>${htmlMulti()}</div>${htmlSuite()}`;
function rendreQuestions() {
  const z = $('#questions');
  if (!qs.qdjFaite && !qs.enCours) qs.enCours = { ...QDJ, qdj: true };
  if (!qs.enCours) {
    qs.props ??= tirerPropositions();
    const m = multiplicateur(qs.suite);
    z.innerHTML = `${enteteQuestions()}
      <div class="props">${qs.props.map((p, i) => { const t = teinte(p.theme); return `<button class="bloc prop pressable" data-i="${i}" style="--t:${t.c}">
        <div class="meta"><span class="tag teinte"><i class="ph-fill ${t.ic}"></i>${esc(p.theme)}</span><span class="diff">${[1, 2, 3, 4, 5].map((d) => `<i class="${d <= p.difficulte ? 'on' : ''}"></i>`).join('')}</span></div>
        <div class="niv">${NIVEAUX[p.difficulte]}</div>
        <div class="gain-prop"><i class="ph-bold ph-timer"></i>−${fmtMin(GAINS[p.difficulte] * m)}</div></button>`; }).join('')}</div>`;
    cascade($('.props', z));
    z.querySelectorAll('.prop').forEach((b) => b.addEventListener('click', () => { vibrer(); son('tap'); transition(() => { qs.enCours = qs.props[b.dataset.i]; qs.props = null; qs.vues.add(qs.enCours.id); rendreQuestions(); }); }));
    return;
  }
  const q = qs.enCours, t = teinte(q.theme), gain = q.qdj ? 180 : GAINS[q.difficulte] * multiplicateur(qs.suite);
  z.style.setProperty('--t', t.c);
  z.innerHTML = `${enteteQuestions()}
    <div class="bloc q-carte${q.qdj ? ' qdj-c' : ''}" id="qc">
      <div class="meta"><span class="tag${q.qdj ? ' or' : ' teinte'}">${q.qdj ? '<i class="ph-fill ph-star"></i>Question du jour' : `<i class="ph-fill ${t.ic}"></i>${esc(q.theme)}`}</span><span class="tag"><i class="ph-bold ph-timer"></i>−${fmtMin(gain)}</span></div>
      <p class="q-texte">${esc(q.question)}</p>
    </div>
    <form class="q-form" id="qf"><input id="qr" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Réponse"><button disabled><i class="ph-bold ph-arrow-up"></i></button></form>
    <div class="verdict" id="qv"></div><div id="liee"></div>`;
  const inp = $('#qr'), bt = $('#qf button');
  inp.addEventListener('input', () => (bt.disabled = !inp.value.trim()));
  $('#qf').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!inp.value.trim() || inp.disabled) return;
    const ok = correcte(q, inp.value);
    inp.disabled = true; bt.disabled = true; inp.blur();
    if (q.qdj) { qs.qdjFaite = true; $('#onglets .pastille')?.remove(); }
    const avant = multiplicateur(qs.suite);
    qs.suite = ok ? qs.suite + 1 : 0;
    const apres = multiplicateur(qs.suite);
    $('#qc').classList.add(ok ? 'juste' : 'faux');
    vibrer(ok ? 20 : [30, 40, 30]);
    son(!ok ? 'faux' : apres > avant ? 'palier' : 'juste');
    if (ok) gagnerMinutes(gain);
    $('#questions .multi').outerHTML = htmlMulti(apres > avant ? ' monte' : '');
    $('#questions .suite').outerHTML = htmlSuite();
    const v = $('#qv'); v.className = `verdict vu ${ok ? 'ok' : 'ko'}`;
    const detail = ok ? (apres > avant ? `${fmtX(apres)} débloqué` : `−${fmtMin(gain)}`) : (avant > 1 ? `Suite perdue · ${fmtX(1)}` : 'Revient dans 3 jours');
    v.innerHTML = `<div class="ico"><i class="ph-bold ${ok ? 'ph-check' : 'ph-x'}"></i></div><div class="txt"><b>${esc(q.reponse)}</b><span>${detail}</span></div><button class="btn2 petit" id="suiv">Suivante</button>`;
    // la réponse est peut-être une carte du catalogue
    const c = carteLiee(q.reponse);
    if (c) {
      const a = possede.has(c.id);
      $('#liee').innerHTML = `<div class="liee">${a ? htmlCarte(c) : `<div class="silhouette"><img src="${c.thumbUrl}" alt=""></div>`}
        <div class="txt"><span class="tag ${a ? 'teinte' : ''}" style="--t:${teinte(colDe(c)?.theme).c}"><i class="ph-fill ${a ? 'ph-cards' : 'ph-magnifying-glass'}"></i>${a ? 'Dans ta collection' : 'À trouver'}</span><b>${esc(c.nom)}</b><span>${esc(c.collection)}</span></div></div>`;
      if (a) $('#liee .k').addEventListener('click', () => fiche([c], 0, $('#liee .k')));
    }
    $('#suiv').addEventListener('click', () => { qs.enCours = null; son('tap'); transition(rendreQuestions); });
  });
}
function gagnerMinutes(m) {
  fin -= m * 60e3;
  const g = document.createElement('div'); g.className = 'gain'; g.innerHTML = `<i class="ph-bold ph-timer"></i>−${fmtMin(m)}`;
  document.body.append(g); setTimeout(() => g.remove(), 1200);

// ---------- fiche : la carte s'agrandit depuis sa place, on glisse pour passer à la suivante ----------
function fiche(liste, i, source) {
  vibrer(); son('tap');
  const f = document.createElement('div');
  f.className = 'fiche';
  const remplir = (sens) => {
    const c = liste[i], q = possede.get(c.id) || 0, epinglee = vitrine?.includes(c.id);
    f.style.setProperty('--img', `url('${c.thumbUrl}')`);
    f.innerHTML = `<div class="flou"></div>
      <div class="barre-f"><button class="retour" id="ff"><i class="ph-bold ph-x"></i></button><span class="pos">${liste.length > 1 ? `${i + 1} / ${liste.length}` : ''}</span>
        ${q ? `<button class="retour epingle${epinglee ? ' on' : ''}" id="fe"><i class="ph${epinglee ? '-fill' : ''} ph-push-pin"></i></button>` : '<span style="width:40px"></span>'}</div>
      <div class="scene">${htmlCarte(c, { image: 'full' })}</div>
      <div class="feuille" style="--rar:var(--r-${c.rarete})">
        <div class="poignee"></div>
        <span class="rar"><i class="ph-fill ${ICONES[c.rarete]}"></i>${NOMS[c.rarete]}</span>
        <h2>${esc(c.nom)}</h2>
        <span class="tag teinte" style="--t:${teinte(colDe(c)?.theme).c}"><i class="ph-fill ${teinte(colDe(c)?.theme).ic}"></i>${esc(c.collection)}</span>
        <div class="stats"><div><b>${c.pv}</b><span>PV</span></div><div><b>×${q}</b><span>Possédée</span></div><div><b>${fr(REVENTE[c.rarete])}</b><span>Revente</span></div></div>
        <p>${esc((c.description || '').split('\n')[0])}</p>
        <div class="actions">
          <a class="btn2 ${q > 1 ? '' : 'seul'}" href="${esc(c.lienWikipedia)}" target="_blank" rel="noopener"><i class="ph-bold ph-book-open-text"></i>Lire</a>
          ${q > 1 ? `<button class="btn2 fantome" id="fv"><i class="ph ph-coins"></i>Vendre ×${q - 1}</button>` : ''}
        </div>
      </div>`;
    const k = $('.scene .k', f);
    if (sens) k.classList.add(sens > 0 ? 'entre-g' : 'entre-d');
    brancherInclinaison(k, 16);
    $('#ff', f).addEventListener('click', fermer);
    $('#fv', f)?.addEventListener('click', () => { son('pieces'); vibrer(15); majSolde(REVENTE[c.rarete] * (q - 1)); toast('ph-diamond', `+${fr(REVENTE[c.rarete] * (q - 1))}`); possede.set(c.id, 1); remplir(); });
    $('#fe', f)?.addEventListener('click', () => {
      son('epingle'); vibrer(10);
      if (vitrine.includes(c.id)) vitrine = vitrine.filter((x) => x !== c.id);
      else { vitrine = [...vitrine, c.id].slice(-3); toast('ph-push-pin', 'Vitrine'); }
      remplir();
    });
    const sc = $('.scene', f); let x0 = null;
    sc.addEventListener('pointerdown', (e) => (x0 = e.clientX));
    sc.addEventListener('pointerup', (e) => {
      if (x0 == null) return; const dx = e.clientX - x0; x0 = null;
      const j = i + (dx < -50 ? 1 : dx > 50 ? -1 : 0);
      if (j === i || j < 0 || j >= liste.length) return;
      vibrer(); son('envoie'); k.classList.add(dx < 0 ? 'sort-g' : 'sort-d');
      setTimeout(() => { i = j; remplir(dx < 0 ? 1 : -1); }, 200);
    });
  };
  const ouvrir = () => { if (source) source.style.viewTransitionName = ''; remplir(); document.body.append(f); document.body.style.overflow = 'hidden'; };
  if (source && document.startViewTransition) { source.style.viewTransitionName = 'carte'; document.startViewTransition(ouvrir); } else ouvrir();
  function fermer() {
    vibrer(); son('tap');
    const partir = () => {
      f.remove(); document.body.style.overflow = '';
      if (ecran === 'accueil') rendreAccueil();
      const cible = document.querySelector(`.ecran.actif .k[data-id="${CSS.escape(liste[i].id)}"]`);
      if (cible) { cible.style.viewTransitionName = 'carte'; setTimeout(() => (cible.style.viewTransitionName = ''), 600); }
    };
    transition(partir);
  }
}

    son('achat'); vibrer(15); majSolde(-prix); paquets++;
    toast('ph-cards', OFFRES.find((o) => o.id === b.dataset.achat).n);
    setTimeout(() => aller('accueil'), 500);
  }));
  $('#tout-vendre')?.addEventListener('click', () => { son('pieces'); vibrer(15); majSolde(doublons * 180); for (const [id, q] of possede) if (q > 1) possede.set(id, 1); toast('ph-diamond', `+${fr(doublons * 180)}`); rendreBoutique(); });
  compter($('.solde-v', z), 'solde', solde, 1);
}

// ---------- plus ----------
function rendrePlus() {
  const r = (ic, lib, val = '', coul = 'var(--texte-2)', id = '') => `<button class="rangee pressable" ${id ? `id="${id}"` : ''}><span class="ic" style="color:${coul}"><i class="ph-fill ${ic}"></i></span><span class="lib">${lib}</span>${val}</button>`;
  const chevron = (v = '') => `<span class="val">${v}</span><i class="ph ph-caret-right"></i>`;
  $('#plus').innerHTML = `<div class="grand-titre"><div><h1>Plus</h1></div></div>
    <div class="bloc groupe">${r('ph-fire', 'Série', chevron('12 j'), '#ff9f5a')}${r('ph-target', 'Objectifs', chevron('3/5'), 'var(--vert)')}${r('ph-clock-counter-clockwise', 'Historique', chevron())}</div>
    <div class="bloc groupe">${r('ph-speaker-high', 'Sons', `<span class="interrupteur${sonActif() ? ' on' : ''}"></span>`, '#6ea8ff', 'r-son')}${r('ph-bell', 'Notifications', chevron('activées'), '#b79cff')}</div>
    <div class="bloc groupe">${r('ph-user-circle', 'Compte Éclats', chevron('connecté'))}${r('ph-gear-six', 'Réglages', chevron())}</div>`;
  cascade($('#plus'));
  $('#r-son').addEventListener('click', () => { activerSon(!sonActif()); $('#r-son .interrupteur').classList.toggle('on', sonActif()); son('epingle'); vibrer(); });
}

// ---------- démarrage ----------
rendreAccueil();
setTimeout(() => { $('#attente').classList.add('parti'); setTimeout(() => $('#attente').remove(), 500); }, Math.max(0, 900 - (performance.now() - debutAttente)));
</script>
