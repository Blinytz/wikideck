<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<title>WikiDeck</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icone.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ouverture.css">
<link rel="stylesheet" href="css/jeu.css">
</head>
<body>
<header id="entete">
  <div class="titre-app">Wiki<span>Deck</span></div>
  <button id="chip-eclats" title="Éclats">
    <span class="gemme">◆</span><span id="eclats-total">0</span>
  </button>
</header>

<main id="contenu">
  <section id="ecran-accueil" class="ecran"></section>
  <section id="ecran-questions" class="ecran"></section>
  <section id="ecran-collection" class="ecran"></section>
  <section id="ecran-boutique" class="ecran"></section>
  <section id="ecran-plus" class="ecran"></section>
  <section id="ecran-historique" class="ecran"></section>
  <section id="ecran-serie" class="ecran"></section>
  <section id="ecran-objectifs" class="ecran"></section>
  <section id="ecran-station" class="ecran"></section>
  <section id="ecran-eclats" class="ecran"></section>
  <section id="ecran-reglages" class="ecran"></section>
  <div id="chargement">Chargement des collections…</div>
</main>

<nav id="navbar">
  <button data-ecran="accueil" class="actif"><span class="ico">🎁</span>Accueil</button>
  <button data-ecran="questions"><span class="ico">❓</span>Questions</button>
  <button data-ecran="collection"><span class="ico">🃏</span>Collection</button>
  <button data-ecran="boutique"><span class="ico">🛒</span>Boutique</button>
  <button data-ecran="plus"><span class="ico">☰</span>Plus</button>
</nav>

<div id="overlays"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
